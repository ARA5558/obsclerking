<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>NOCA - New Obstetric Clerking Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900;1000&display=swap" rel="stylesheet">
<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<!-- Confetti Animation Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
  --font: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --rose: #f472b6; 
  --rose-d: #db2777; 
  --rose-pale: #fdf2f8;
  --purple: #8b5cf6; 
  --purple-pale: #f5f3ff;
  --blue: #3b82f6; 
  --blue-pale: #eff6ff;
  --teal: #10b981; 
  --teal-pale: #ecfdf5;
  --gray50: #f8fafc; 
  --gray100: #f1f5f9; 
  --gray200: #e2e8f0;
  --gray400: #94a3b8; 
  --gray600: #475569; 
  --gray800: #1e293b;
  --bg-clay: rgba(255, 255, 255, 0.75);
  --r: 28px;
  --rsm: 18px;
  --clay-out: 0 10px 30px rgba(0, 0, 0, 0.06), inset 2px 2px 6px rgba(255, 255, 255, 0.85);
  --clay-btn-out: 0 6px 16px rgba(148, 163, 184, 0.22), -3px -3px 8px rgba(255, 255, 255, 0.9);
  --clay-btn-in: inset 3px 3px 6px rgba(162, 177, 198, 0.35), inset -3px -3px 6px rgba(255, 255, 255, 0.85);
  --clay-btn-rose-in: inset 3px 3px 6px rgba(219, 39, 119, 0.25), inset -3px -3px 6px rgba(255, 255, 255, 0.8);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

@keyframes auroraBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

html, body {
  font-family: var(--font); 
  color: var(--gray800); 
  min-height: 100vh; 
  scroll-behavior: smooth;
  background: linear-gradient(-45deg, #fbcfe8, #e9d5ff, #bae6fd, #a5f3fc, #fbcfe8);
  background-size: 400% 400%;
  animation: auroraBG 16s ease infinite;
}

.toast {
  position: fixed; 
  top: calc(20px + env(safe-area-inset-top)); 
  left: 50%; 
  transform: translateX(-50%) translateY(-150px);
  background: linear-gradient(135deg, var(--rose-d) 0%, var(--purple) 100%);
  color: white; 
  padding: 14px 28px; 
  border-radius: 30px; 
  font-weight: 800; 
  font-family: var(--font); 
  font-size: 15px;
  box-shadow: 0 10px 25px rgba(112, 72, 232, 0.4); 
  z-index: 9999999;
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex; 
  align-items: center; 
  gap: 10px; 
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { 
  transform: translateX(-50%) translateY(0); 
}

.code-red-btn {
  position: fixed; 
  bottom: 96px; 
  right: 20px;
  background: #ef4444; 
  color: white;
  width: 65px; 
  height: 65px; 
  border-radius: 50%;
  align-items: center; 
  justify-content: center;
  font-size: 30px; 
  box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
  z-index: 100000; 
  cursor: pointer; 
  border: 4px solid #b91c1c; 
  animation: pulseAlert 1.5s infinite; 
  transition: all 0.2s; 
  touch-action: manipulation;
  display: none;
}
.code-red-btn:active { transform: scale(0.92); }
.code-red-btn.active-alarm {
  background: #b91c1c; 
  animation: none; 
  font-size: 13px; 
  font-weight: 900;
  text-align: center; 
  line-height: 1.1; 
  border-color: white;
}

@keyframes pulseAlert {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); transform: scale(1); }
  70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); transform: scale(1.03); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(1); }
}

.red-banner {
  background: #fef2f2; 
  border: 2px solid #ef4444; 
  border-radius: 20px; 
  padding: 16px; 
  margin-bottom: 16px; 
  box-shadow: 0 8px 20px rgba(239, 68, 68, 0.15);
}
.btn-dismiss {
  margin-top: 12px; 
  width: 100%; 
  padding: 12px; 
  border-radius: 12px; 
  background: #ef4444; 
  color: white; 
  border: none; 
  font-weight: 900; 
  font-size: 15px; 
  cursor: pointer; 
  transition: all 0.2s; 
  touch-action: manipulation;
}
.btn-dismiss:active { transform: scale(0.96); }

.lang-screen {
  min-height: 100vh; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  padding: 32px 24px; 
  text-align: center; 
  max-width: 520px; 
  margin: 0 auto; 
  position: relative;
}

.lang-logo { 
  font-size: 72px; 
  margin-bottom: 12px; 
  animation: float 3s ease-in-out infinite; 
}
@keyframes float { 
  0% { transform: translateY(0px); } 
  50% { transform: translateY(-8px); } 
  100% { transform: translateY(0px); } 
}

.noca-acronym {
  font-size: 44px; 
  font-weight: 1000; 
  letter-spacing: -1px; 
  line-height: 1; 
  margin-bottom: 6px;
  color: var(--purple); 
  text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
}
.noca-fulltitle {
  font-size: 19px; 
  font-weight: 800; 
  letter-spacing: -0.2px; 
  line-height: 1.3; 
  color: var(--gray600); 
  margin-bottom: 24px;
}

.clay-card {
  background: var(--bg-clay);
  backdrop-filter: blur(12px); 
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--r);
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: var(--clay-out);
}

.lang-benefit { 
  padding: 22px; 
  font-size: 14px; 
  font-weight: 700; 
  color: var(--gray800); 
  margin-bottom: 18px; 
  line-height: 1.6; 
  text-align: left; 
  width: 100%;
}

.lang-btns-grid {
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 16px; 
  width: 100%; 
  margin-bottom: 20px;
}

.lang-btn {
  padding: 22px 14px; 
  border-radius: var(--r); 
  border: 2px solid rgba(255,255,255,0.4); 
  font-family: var(--font); 
  cursor: pointer; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  gap: 6px; 
  transition: all 0.2s; 
  touch-action: manipulation;
}
.lang-btn:hover, .lang-btn:active { transform: scale(0.96); }
.lang-btn-purple {
  background: var(--purple); 
  color: white; 
  box-shadow: 8px 8px 20px rgba(129, 140, 248, 0.4), inset 2px 2px 6px rgba(255,255,255,0.4);
}
.lang-btn-blue {
  background: var(--blue); 
  color: white; 
  box-shadow: 8px 8px 20px rgba(96, 165, 250, 0.4), inset 2px 2px 6px rgba(255,255,255,0.4);
}

.lang-name strong { font-size: 18px; font-weight: 900; }
.lang-name span { font-size: 13px; font-weight: 700; opacity: 0.9; }

.app { display: none; }
.app.show { display: block; }

.header { 
  background: var(--bg-clay); 
  padding: calc(18px + env(safe-area-inset-top)) 20px 20px; 
  color: var(--gray800); 
  position: sticky; 
  top: 0; 
  z-index: 50; 
  border-bottom-left-radius: 32px; 
  border-bottom-right-radius: 32px; 
  box-shadow: 0 12px 24px rgba(162, 177, 198, 0.15); 
  border-bottom: 2px solid rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.header h1 { font-size: 22px; font-weight: 900; color: var(--rose-d); letter-spacing: -0.5px;}
.header p { font-size: 13px; color: var(--gray600); margin-top: 2px; font-weight: 700; }

.lang-switch-btn { 
  background: var(--bg-clay); 
  border: 2px solid rgba(255,255,255,0.7); 
  color: var(--rose-d); 
  border-radius: 20px; 
  padding: 8px 16px; 
  font-family: var(--font); 
  font-size: 14px; 
  font-weight: 900; 
  cursor: pointer; 
  touch-action: manipulation; 
  box-shadow: var(--clay-btn-out); 
  transition: all 0.2s;
}
.lang-switch-btn:active { box-shadow: var(--clay-btn-in); transform: scale(0.95); }

.progress-track { 
  background: var(--gray200); 
  border-radius: 12px; 
  height: 12px; 
  overflow: hidden; 
  margin-top: 8px; 
  box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
}
.progress-fill { 
  height: 100%; 
  background: linear-gradient(90deg, var(--rose-d), var(--purple)); 
  border-radius: 12px; 
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
}
.progress-info { 
  display: flex; 
  justify-content: space-between; 
  margin-top: 8px; 
  font-size: 12px; 
  font-weight: 900; 
  color: var(--gray600); 
}

.steps-wrap { 
  padding: 20px 16px calc(130px + env(safe-area-inset-bottom)); 
  max-width: 560px; 
  margin: 0 auto; 
}
.step { display: none; animation: stepIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
.step.active { display: block; }
@keyframes stepIn { 
  from { opacity: 0; transform: translateY(12px) scale(0.98); } 
  to { opacity: 1; transform: translateY(0) scale(1); } 
}

.step-card { 
  background: var(--bg-clay); 
  backdrop-filter: blur(12px); 
  -webkit-backdrop-filter: blur(12px); 
  border-radius: 32px; 
  padding: 28px 20px; 
  border: 2px solid rgba(255,255,255,0.7); 
  box-shadow: var(--clay-out); 
}
.step-emoji { font-size: 46px; margin-bottom: 12px; display: block; text-align: center; }
.sec-badge { 
  display: table; 
  margin: 0 auto 14px; 
  background: linear-gradient(135deg, var(--rose-d) 0%, var(--purple) 100%); 
  color: white; 
  border-radius: 20px; 
  padding: 8px 20px; 
  font-size: 13px; 
  font-weight: 900; 
  text-transform: uppercase; 
  letter-spacing: 0.8px; 
  box-shadow: 0 5px 12px rgba(139, 92, 246, 0.35); 
}
.q-text { font-size: 21px; font-weight: 900; color: var(--gray800); line-height: 1.3; margin-bottom: 10px; text-align: center; }
.q-sub { font-size: 14px; color: var(--gray600); margin-bottom: 20px; font-weight: 700; text-align: center; line-height: 1.5; }

.big-opt { 
  padding: 16px 18px; 
  border: 2px solid transparent; 
  border-radius: var(--rsm); 
  background: var(--bg-clay); 
  font-family: var(--font); 
  font-size: 15px; 
  font-weight: 800; 
  color: var(--gray800); 
  cursor: pointer; 
  text-align: left; 
  display: flex; 
  align-items: center; 
  gap: 14px; 
  transition: all 0.2s; 
  width: 100%; 
  margin-bottom: 14px; 
  touch-action: manipulation; 
  user-select: none; 
  box-shadow: var(--clay-btn-out); 
}
.big-opt:last-child { margin-bottom: 0; }
.big-opt:active { transform: scale(0.97); box-shadow: var(--clay-btn-in); }
.radio-box { 
  width: 24px; 
  height: 24px; 
  border-radius: 8px; 
  border: none; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  flex-shrink: 0; 
  transition: all 0.2s; 
  font-size: 14px; 
  font-weight: 900; 
  color: transparent; 
  background: #e2e8f0; 
  box-shadow: inset 2px 2px 5px rgba(162, 177, 198, 0.3); 
}
.big-opt.sel { 
  background: var(--rose-pale); 
  color: var(--rose-d); 
  box-shadow: var(--clay-btn-rose-in); 
  border: 2px solid #fff; 
}
.big-opt.sel .radio-box { 
  background: var(--rose-d); 
  color: white; 
}

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 0; }
.grid2 .big-opt { margin-bottom: 0; }

.big-input { 
  width: 100%; 
  padding: 15px 18px; 
  border: 2px solid rgba(255,255,255,0.6); 
  border-radius: var(--rsm); 
  font-family: var(--font); 
  font-size: 15px; 
  font-weight: 800; 
  color: var(--gray800); 
  background: #e9eff5; 
  transition: all 0.2s; 
  appearance: none; 
  -webkit-appearance: none; 
  box-shadow: var(--clay-btn-in); 
}
input[type="text"].big-input, textarea.big-input { text-transform: capitalize; }
.big-input:focus { 
  outline: none; 
  background: #e2e9f0; 
  color: var(--purple); 
  box-shadow: inset 4px 4px 8px rgba(162, 177, 198, 0.4), inset -4px -4px 8px rgba(255, 255, 255, 0.9); 
}
.big-input::placeholder { color: var(--gray400); font-weight: 600; text-transform: none; }
.big-textarea { min-height: 100px; resize: vertical; }

.num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.num-group .nl { 
  font-size: 12px; 
  font-weight: 900; 
  color: var(--gray600); 
  text-transform: uppercase; 
  letter-spacing: 0.5px; 
  margin-bottom: 6px; 
  display: block; 
}

.result-box { 
  background: var(--bg-clay); 
  border: 2px solid rgba(255,255,255,0.7); 
  border-radius: var(--rsm); 
  padding: 16px; 
  margin-top: 16px; 
  display: none; 
  text-align: center; 
  box-shadow: var(--clay-out); 
}
.result-box.show { display: block; }
.rl { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px; color: var(--teal); }
.rv { font-size: 24px; font-weight: 900; color: var(--teal); margin-top: 4px; }
.rs { font-size: 14px; color: var(--teal); font-weight: 700; opacity: 0.85; margin-top: 4px; }

.check-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.ci { 
  padding: 15px 18px; 
  border: 2px solid transparent; 
  border-radius: var(--rsm); 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  font-weight: 800; 
  font-size: 15px; 
  color: var(--gray800); 
  background: var(--bg-clay); 
  transition: all 0.2s; 
  user-select: none; 
  box-shadow: var(--clay-btn-out); 
}
.ci.checked { 
  background: var(--rose-pale); 
  color: var(--rose-d); 
  box-shadow: var(--clay-btn-rose-in); 
  border: 2px solid #fff; 
}
.cd { 
  width: 24px; 
  height: 24px; 
  border-radius: 8px; 
  border: none; 
  flex-shrink: 0; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 14px; 
  transition: all 0.2s; 
  color: transparent; 
  background: #e2e8f0; 
  box-shadow: inset 2px 2px 4px rgba(162, 177, 198, 0.3); 
}
.ci.checked .cd { background: var(--rose-d); color: white; }

.reveal { display: none; margin-top: 16px; animation: fadeIn 0.3s ease; }
.reveal.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.mini-lbl { 
  font-size: 12px; 
  font-weight: 900; 
  color: var(--gray600); 
  text-transform: uppercase; 
  letter-spacing: 0.5px; 
  margin-bottom: 6px; 
  display: block; 
  margin-top: 14px; 
}
.divider { height: 2px; background: var(--gray200); margin: 20px 0; border-radius: 2px; opacity: 0.6; }

.birth-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mf label { font-size: 11px; font-weight: 900; color: var(--gray600); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
.mf input, .mf select { 
  width: 100%; 
  padding: 13px; 
  border: 2px solid rgba(255,255,255,0.5); 
  border-radius: 12px; 
  font-family: var(--font); 
  font-size: 14px; 
  font-weight: 800; 
  color: var(--gray800); 
  background: #e9eff5; 
  box-shadow: var(--clay-btn-in); 
}
.mf.full { grid-column: 1 / -1; }
input[type="text"].mf-text { text-transform: capitalize; }

.add-birth-btn { 
  width: 100%; 
  padding: 16px; 
  border: 2px solid rgba(255,255,255,0.6); 
  border-radius: var(--rsm); 
  background: var(--purple-pale); 
  font-family: var(--font); 
  font-size: 15px; 
  font-weight: 900; 
  color: var(--purple); 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  gap: 6px; 
  box-shadow: var(--clay-btn-out); 
}
.add-birth-btn:active { box-shadow: var(--clay-btn-in); }

.bottom-bar { 
  position: fixed; 
  bottom: 0; 
  left: 0; 
  right: 0; 
  background: var(--bg-clay); 
  padding: 14px 18px calc(16px + env(safe-area-inset-bottom)); 
  display: flex; 
  gap: 14px; 
  z-index: 999999; 
  box-shadow: 0 -10px 24px rgba(162, 177, 198, 0.18); 
  border-top-left-radius: 28px; 
  border-top-right-radius: 28px; 
  border-top: 2px solid rgba(255,255,255,0.8);
  backdrop-filter: blur(12px);
}
.btn-back { 
  padding: 15px 22px; 
  border-radius: var(--rsm); 
  border: 2px solid rgba(255,255,255,0.6); 
  background: var(--bg-clay); 
  font-family: var(--font); 
  font-size: 16px; 
  font-weight: 900; 
  color: var(--gray600); 
  cursor: pointer; 
  flex-shrink: 0; 
  box-shadow: var(--clay-btn-out); 
}
.btn-back:active { box-shadow: var(--clay-btn-in); }
.btn-next { 
  flex: 1; 
  padding: 15px; 
  border-radius: var(--rsm); 
  border: none; 
  background: linear-gradient(135deg, var(--rose-d) 0%, var(--purple) 100%); 
  font-family: var(--font); 
  font-size: 16px; 
  font-weight: 900; 
  color: white; 
  cursor: pointer; 
  box-shadow: 6px 6px 18px rgba(139, 92, 246, 0.35); 
}
.btn-next:active { transform: scale(0.97); }

.act-btn { 
  width: 100%; 
  padding: 16px; 
  border-radius: var(--rsm); 
  border: 2px solid rgba(255,255,255,0.6); 
  background: var(--bg-clay); 
  font-family: var(--font); 
  font-size: 15px; 
  font-weight: 900; 
  color: var(--gray800); 
  cursor: pointer; 
  text-align: center; 
  box-shadow: var(--clay-btn-out); 
}
.act-btn:active { box-shadow: var(--clay-btn-in); }

.sum-hero { text-align: center; padding: 10px 0 20px; }
.sum-hero .he { font-size: 64px; animation: float 3s ease-in-out infinite; }
.sum-hero h2 { font-size: 26px; font-weight: 900; margin-top: 12px; color: var(--purple); }
.sum-hero p { font-size: 15px; color: var(--gray600); font-weight: 700; margin-top: 6px; line-height: 1.5; }
.qr-box { 
  background: var(--bg-clay); 
  border-radius: var(--r); 
  border: 2px solid rgba(255,255,255,0.7); 
  padding: 24px 16px; 
  margin-bottom: 20px; 
  text-align: center; 
  box-shadow: var(--clay-out); 
}
.qr-title { font-size: 17px; font-weight: 900; color: var(--blue); margin-bottom: 12px; }

@media(max-width:380px){
  .grid2 { grid-template-columns: 1fr; } 
  .num-row { grid-template-columns: 1fr; }
}

@media print {
  body { background: white !important; }
  .lang-screen, .header, .bottom-bar, .act-btns, .progress-track, .progress-info, .code-red-btn { display: none !important; }
  .app, .step-card, .clay-card { box-shadow: none !important; border: none !important; padding: 0 !important; background: transparent !important;}
  .sum-hero { padding-top: 0; }
  .qr-box { break-inside: avoid; margin-bottom: 20px; border: 1px solid #ccc !important;}
  .steps-wrap { padding: 0; }
}
</style>
</head>
<body>

<audio id="successSound" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<audio id="emergencyAlarm" loop preload="auto">

function txVal(val) {
  if (!val || typeof val !== 'string') return val;
  if (BM_TO_EN[val]) return BM_TO_EN[val];
  return val;
}
function txArr(arr) {
  if (!Array.isArray(arr)) return arr;
  return arr.map(function(v){ return txVal(v) || v; });
}

function showToast(msg) {
  let toast = document.getElementById('halfwayToast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, 3500);
}

let peTimer = null;
let fmTimer = null;

function checkRedFlags() {
  let triggerPE = D.sympHeadache || D.sympVision || D.sympNau || D.sympAbd || D.sympWeight || D.sympSwelling;
  let peBanner = document.getElementById('peWarningBanner');
  
  if (peBanner) {
    if (triggerPE && !D.dismissedPE) {
      peBanner.style.display = 'block';
      if (!peTimer) {
        peTimer = setTimeout(() => { dismissBanner('PE'); }, 15000);
      }
    } else {
      peBanner.style.display = 'none';
      if(peTimer) { clearTimeout(peTimer); peTimer = null; }
    }
  }

  let fmStatus = typeof D.sympFetal === 'string' ? D.sympFetal.toLowerCase() : '';
  let triggerFM = fmStatus.includes('less') || fmStatus.includes('kurang');
  let fmBanner = document.getElementById('fmWarningBanner');
  
  if (fmBanner) {
    if (triggerFM && !D.dismissedFM) {
      fmBanner.style.display = 'block';
      if (!fmTimer) {
        fmTimer = setTimeout(() => { dismissBanner('FM'); }, 15000);
      }
    } else {
      fmBanner.style.display = 'none';
      if(fmTimer) { clearTimeout(fmTimer); fmTimer = null; }
    }
  }
}

function dismissBanner(type) {
  if (type === 'PE') {
    D.dismissedPE = true;
    let b = document.getElementById('peWarningBanner');
    if(b) b.style.display = 'none';
    if(peTimer) { clearTimeout(peTimer); peTimer = null; }
  }
  if (type === 'FM') {
    D.dismissedFM = true;
    let b = document.getElementById('fmWarningBanner');
    if(b) b.style.display = 'none';
    if(fmTimer) { clearTimeout(fmTimer); fmTimer = null; }
  }
}

function toggleEmergency() {
  let alarm = document.getElementById('emergencyAlarm');
  let btn = document.getElementById('codeRedBtn');
  
  if(!btn.classList.contains('active-alarm')) {
    btn.classList.add('active-alarm');
    btn.innerHTML = 'STOP<br>ALARM';
    alarm.volume = 1.0;
    alarm.currentTime = 0;
    let playPromise = alarm.play();
    if (playPromise !== undefined) {
      playPromise.catch(error => { 
        showToast(lang === 'ms' ? 'Sila kuatkan bunyi pembesar suara anda.' : 'Please raise your device volume.');
      });
    }
  } else {
    btn.classList.remove('active-alarm');
    btn.innerHTML = '🚨';
    alarm.pause();
    alarm.currentTime = 0;
  }
}

function chooseLang(selectedLang) {
  startTime = Date.now();
  lang = selectedLang;
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('appWrap').classList.add('show');
  document.getElementById('bottomBar').style.display = 'flex';
  document.getElementById('codeRedBtn').style.display = 'flex';
  
  buildAllSteps();
  
  let steps = document.querySelectorAll('.step');
  steps.forEach(s => s.classList.remove('active'));
  let currStep = document.getElementById('s' + cur);
  if (currStep) currStep.classList.add('active');
  
  restoreInputs();
  updateUI();
  window.scrollTo(0,0);

function switchLang() {
  lang = lang === 'en' ? 'ms' : 'en';
  collectInputs(); 
  buildAllSteps();
  
  let steps = document.querySelectorAll('.step');
  steps.forEach(s => s.classList.remove('active'));
  let currStep = document.getElementById('s' + cur);
  if (currStep) currStep.classList.add('active');
  
  restoreInputs();
  updateUI();
}

function pick(key, val, btn) { 
  D[key] = val; 
  if (btn) { 
    var grp = btn.closest('.grid2, .reveal, #fetalMoveSect, #mgttYNRev, #gbsCurrRev, #gbsPrevRev') || btn.parentElement;
    if (grp) {
      var opts = grp.querySelectorAll('.big-opt');
      for(var i=0; i<opts.length; i++) { opts[i].classList.remove('sel'); }
    }
    btn.classList.add('sel'); 
  } 
  if(key === 'sympFetal') checkRedFlags();
}

function toggleCheck(el, key, val) { 
  if (!el) return;
  var isChecked = el.classList.contains('checked');
  if (isChecked) { el.classList.remove('checked'); } else { el.classList.add('checked'); }
  if (!Array.isArray(D[key])) { D[key] = []; }
  if (!isChecked) { 
    if (D[key].indexOf(val) === -1) { D[key].push(val); }
  } else { 
    var idx = D[key].indexOf(val);
    if (idx !== -1) { D[key].splice(idx, 1); }
  }
  if(key === 'pmiNew') { checkShowHb(); checkShowGdmTx(); checkShowHtnTx(); }
}

function clearChecks(key) { 
  var els = document.querySelectorAll('.ci');
  for(var i=0; i<els.length; i++) {
    var attr = els[i].getAttribute('onclick');
    if (attr && attr.indexOf("'" + key + "'") !== -1) { els[i].classList.remove('checked'); } 
  }
  D[key] = []; 
  if(key === 'pmiNew') { checkShowHb(); checkShowGdmTx(); checkShowHtnTx(); }
}

  pick('race', val, btn);
  let rev = document.getElementById('countryRev');

    if(rev) rev.classList.add('show');
  } else {
    if(rev) rev.classList.remove('show');
    D.raceCountry = '';
    setTimeout(next, 300);
  }
}

function card(badge, emoji, q, sub, body) {
  return '<div class="step-card"><div class="sec-badge">' + badge + '</div><span class="step-emoji">' + emoji + '</span><div class="q-text">' + q + '</div>' + (sub ? '<div class="q-sub">' + sub + '</div>' : '') + '<div class="q-body">' + body + '</div></div>';
}

function optBtn(label, value, key, autoNext=false, revealId='') {
  let selClass = (D[key] === value) ? 'sel' : '';
  let clickLogic = "pick('" + key + "', '" + value + "', this);";
  if (revealId === 'show') clickLogic += "let r1=document.getElementById('" + key + "Rev'); if(r1) r1.classList.add('show');";
  if (revealId === 'hide') clickLogic += "let r2=document.getElementById('" + key + "Rev'); if(r2) r2.classList.remove('show');";
  if (autoNext) clickLogic += "setTimeout(next, 300);";
  return '<button type="button" class="big-opt ' + selClass + '" onclick="' + clickLogic + '"><div class="radio-box">✓</div><div style="text-align:left"><span>' + label + '</span></div></button>';
}

function optBtnLife(label, value, key) {

function calcPOG() {
  const sdVal = document.getElementById('scanDate')?.value;
  if (!sdVal) return;
  D.scanDate = sdVal;
  
  let sd = new Date(sdVal);
  sd.setHours(0,0,0,0);
  let td = new Date();
  td.setHours(0,0,0,0);
  
  let diff = Math.round((sd.getTime() - td.getTime()) / 86400000);
  let pD = 280 - diff;
  let pW = Math.floor(pD / 7);
  let pDays = pD % 7;
  
  const bx = document.getElementById('pogBox');
  const pv = document.getElementById('pogVal');
  if (pD >= 0 && pv && bx) {
    pv.textContent = pW + "w " + pDays + "d";
    bx.classList.add('show');
  } else if (pv && bx) {
    pv.textContent = "—";
    bx.classList.add('show');
  }
}

function setNewCondFup(cond, val, btn) {
  if(!D.newCondDetails[cond]) D.newCondDetails[cond] = {wks:'', fup:'', meds:''};

  let p = btn.parentElement;
  let opts = p.querySelectorAll('.big-opt');
  opts.forEach(o => o.classList.remove('sel'));
  btn.classList.add('sel');
}

function toggleAdmitReason(el, idx, val) {
  el.classList.toggle('checked');
  if(!D.currAdmitList[idx].reasons) D.currAdmitList[idx].reasons = [];
  if(el.classList.contains('checked')) {
     if(D.currAdmitList[idx].reasons.indexOf(val) === -1) D.currAdmitList[idx].reasons.push(val);
  } else {
     let i = D.currAdmitList[idx].reasons.indexOf(val);
     if(i !== -1) D.currAdmitList[idx].reasons.splice(i, 1);
  }

function renderCurrAdmitList() {
  const wrap = document.getElementById('currAdmitWrap');
  if(!wrap) return;
  const L = T[lang];
  if(D.currAdmitList.length === 0) {
     wrap.innerHTML = `<div style="text-align:center; padding:16px; margin-bottom:16px; border:2px dashed var(--gray200); border-radius:12px; color:var(--gray400); font-weight:700; font-size:14px;">${L.lblNoChild}</div>`;
     return;
  }
  let html = '';
  D.currAdmitList.forEach((r, i) => {
     html += '<div style="background:var(--bg-clay); border:2px solid rgba(255,255,255,0.6); border-radius:14px; padding:16px; margin-bottom:16px; box-shadow: var(--clay-out);">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
           '<div style="font-size:14px; font-weight:900; color:var(--purple); text-transform:uppercase;">ADMISSION ' + (i+1) + '</div>' +
           '<button type="button" onclick="removeCurrAdmit(' + i + ')" style="background:var(--rose-pale); color:var(--rose-d); border:none; border-radius:50%; width:28px; height:28px; font-size:16px; font-weight:bold; cursor:pointer;">×</button>' +
        '</div>' +
        '<div class="birth-fields">' +
           '<div class="mf full"><label>' + L.lblAdmitWeeks + '</label><input type="number" inputmode="numeric" placeholder="e.g. 32" value="' + (r.weeks||'') + '" oninput="D.currAdmitList[' + i + '].weeks=this.value"></div>' +
           '<div class="mf full"><label>' + L.lblAdmitReason + '</label>';
           
     let reasonStrHtml = '<div style="display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px; margin-bottom:8px;">';
     L.admitReasons.forEach(c => {
        let isChked = (r.reasons||[]).includes(c) ? 'checked' : '';
        reasonStrHtml += `<div class="ci ${isChked}" style="padding:10px; font-size:13px; font-weight:700; cursor:pointer;" onclick="toggleAdmitReason(this, ${i}, '${c}')"><div class="cd" style="width:18px;height:18px;font-size:12px;">✓</div>${c}</div>`;
     });
     reasonStrHtml += '</div>';
     
     html += reasonStrHtml +
             '<input type="text" class="mf-text" placeholder="' + L.s18other + '" value="' + (r.otherReason||'') + '" oninput="D.currAdmitList[' + i + '].otherReason=this.value"></div>' +
        '</div></div>';
  });
  wrap.innerHTML = html;
}

function updatePregComp(idx, val, isChecked) {
   if(!D.pregList[idx].compArr) D.pregList[idx].compArr = [];
   if(isChecked) {
      if(D.pregList[idx].compArr.indexOf(val) === -1) D.pregList[idx].compArr.push(val);
   } else {
      let i = D.pregList[idx].compArr.indexOf(val);
      if(i !== -1) D.pregList[idx].compArr.splice(i, 1);
   }
}

function togglePregComp(el, idx, val) {
  el.classList.toggle('checked');
  updatePregComp(idx, val, el.classList.contains('checked'));
}

  if (cur >= TOTAL-1) return; 
  collectInputs(); 
  
  const currentStep = document.getElementById('s'+cur);
  if (currentStep) currentStep.classList.remove('active'); 
  
  cur++; 
  const nextStep = document.getElementById('s'+cur);
  if (nextStep) nextStep.classList.add('active'); 
  
  updateUI(); 
  if (cur === TOTAL-1) buildSummary(); 
  window.scrollTo(0,0); 
}

function prev() { 
  if (cur <= 0) return; 
  collectInputs(); 
  
  const currentStep = document.getElementById('s'+cur);
  if (currentStep) currentStep.classList.remove('active'); 
  
  cur--; 
  const prevStep = document.getElementById('s'+cur);
  if (prevStep) prevStep.classList.add('active'); 
  
  updateUI(); 
  window.scrollTo(0,0); 
}

function nextBtn() { collectInputs(); next(); }

function updateUI() { 
  const L = T[lang]; 
  const pct = Math.round((cur/(TOTAL-1))*100); 
  
  document.getElementById('pFill').style.width = pct+'%'; 
  let pPctEl = document.getElementById('pPct');
  if (pPctEl) pPctEl.textContent = pct + '%'; 
  
  if (L.pLabels && L.pLabels[cur]) {
    document.getElementById('pLabel').textContent = L.pLabels[cur]; 
  }
  
  document.getElementById('btnNext').textContent = cur===0 ? (L.s0btn || L.btnStart) : L.btnNext; 
  document.getElementById('btnBack').textContent = L.btnBack; 
  document.getElementById('btnBack').style.display = cur===0 ? 'none' : ''; 
  document.getElementById('btnNext').style.display = cur===TOTAL-1 ? 'none' : ''; 
  
  if (pct >= 50 && !halfwayShown && cur !== TOTAL-1) {
     halfwayShown = true;
     showToast(L.halfwayMsg);
  }
}

function collectInputs() {
  [['name','name'],['icPassport','icPassport'],['maritalStatus','maritalStatus'],['marriedYear','marriedYear'],['currentClinic','currentClinic'],['bookingClinic','bookingClinic'],['bookingPOA','bookingPOA'],['bookingHb','bookingHb'],['bookingBP','bookingBP'],['currentWeight','currentWeight'],['sympLaborOther','sympLaborOther'],['fmTime','fmTime'],['fmCount','fmCount'],['mgtt1Wks','mgtt1Wks'],['mgtt1Fbs','mgtt1Fbs'],['mgtt1TwoHr','mgtt1TwoHr'],['mgtt1Res','mgtt1Res'],['mgtt2Wks','mgtt2Wks'],['mgtt2Fbs','mgtt2Fbs'],['mgtt2TwoHr','mgtt2TwoHr'],['foodAllergyOther','foodAllergyOther'],['medAllergyOther','medAllergyOther'],['pmiOthers','pmiOthers'],['pmiNewOthers','pmiNewOthers'],['latestHbVal','latestHbVal'],['latestHbDate','latestHbDate'],['psychOthers','psychOthers'],['psychFollowUp','psychFollowUp'],['psychYear','psychYear'],['medications','medications'],['surgDetails','surgDetails'],['fhxCancerType','fhxCancerType'],['husbAge','husbAge'],['husbOcc','husbOcc'],['patOccStudent','patOccStudent'],['patOccWorking','patOccWorking'],['age','age']].forEach(([id,key])=>{ const el = document.getElementById(id); if (el) D[key] = el.value; });
  const lmpEl = document.getElementById('lmp'); if (lmpEl?.value) D.lmp = lmpEl.value;
  const scanEl = document.getElementById('scanDate'); if (scanEl?.value) D.scanDate = scanEl.value;
  const hEl = document.getElementById('height'), wEl = document.getElementById('bookingWeight');
  if (hEl?.value) D.height = hEl.value; if (wEl?.value) D.bookingWeight = wEl.value;
}

function restoreInputs() {
  const map = {name:D.name,icPassport:D.icPassport,maritalStatus:D.maritalStatus,marriedYear:D.marriedYear,currentClinic:D.currentClinic,bookingClinic:D.bookingClinic,bookingPOA:D.bookingPOA,bookingHb:D.bookingHb,bookingBP:D.bookingBP,currentWeight:D.currentWeight,sympLaborOther:D.sympLaborOther,fmTime:D.fmTime,fmCount:D.fmCount,mgtt1Wks:D.mgtt1Wks,mgtt1Fbs:D.mgtt1Fbs,mgtt1TwoHr:D.mgtt1TwoHr,mgtt2Wks:D.mgtt2Wks,mgtt2Fbs:D.mgtt2Fbs,mgtt2TwoHr:D.mgtt2TwoHr,foodAllergyOther:D.foodAllergyOther,medAllergyOther:D.medAllergyOther,pmiOthers:D.pmiOthers,pmiNewOthers:D.pmiNewOthers,latestHbVal:D.latestHbVal,latestHbDate:D.latestHbDate,psychOthers:D.psychOthers,psychFollowUp:D.psychFollowUp,psychYear:D.psychYear,medications:D.medications,surgDetails:D.surgDetails,fhxCancerType:D.fhxCancerType,husbAge:D.husbAge,husbOcc:D.husbOcc,patOccStudent:D.patOccStudent,patOccWorking:D.patOccWorking,height:D.height,bookingWeight:D.bookingWeight,lmp:D.lmp,scanDate:D.scanDate,age:D.age};
  Object.entries(map).forEach(([id,val])=>{ const el = document.getElementById(id); if (el && val) el.value = val; });
  if (D.height && D.bookingWeight) calcBMI(); 
  if (D.lmp) calcEDD();
  if (D.scanDate) calcPOG();
}

function calcBMI() { 
  const h = parseFloat(document.getElementById('height')?.value); 
  const w = parseFloat(document.getElementById('bookingWeight')?.value); 
  if (!h||!w||h<50) return; 
  const bmi = (w/((h/100)**2)).toFixed(1); 
  D.bmi = bmi; 
  const L = T[lang]; 
  const el = document.getElementById('bmiVal'), ce = document.getElementById('bmiCat'), bx = document.getElementById('bmiBox'); 
  if (!el) return; 
  el.textContent = bmi+' kg/m²'; 
  const idx = bmi<18.5?0:bmi<25?1:bmi<30?2:3; 
  ce.textContent = L.bmiCats[idx]; 
  bx.classList.add('show'); 
}

function calcEDD() { 
  const lmp = document.getElementById('lmp')?.value; 
  if (!lmp) return; 
  D.lmp = lmp; 
  const edd = new Date(new Date(lmp).getTime()+280*86400000); 
  D.edd = fmt(edd); 
  const days = Math.floor((new Date()-new Date(lmp))/86400000); 
  D.gaWeeks = Math.floor(days/7); 
  const d = days%7; 
  D.ga = days>=0 ? `${D.gaWeeks}w ${d}d` : `EDD in ${Math.floor(Math.abs(days)/7)}w`; 
  const L = T[lang]; 
  const ev = document.getElementById('eddVal'), gv = document.getElementById('gaVal'), bx = document.getElementById('eddBox'); 
  if (!ev) return; 
  ev.textContent = D.edd; 
  gv.textContent = L.gaPrefix + D.ga; 
  bx.classList.add('show'); 
}

function fmt(d) { 
  if (!(d instanceof Date) || isNaN(d)) return '-';
  let dd = String(d.getDate()).padStart(2, '0');
  let mm = String(d.getMonth() + 1).padStart(2, '0');
  let yyyy = d.getFullYear();
  return dd + '/' + mm + '/' + yyyy;
}

function generateSplitSummaries() {
  let reddPOG = "";
  if (D.scanYN === 'Yes' || D.scanYN === 'Ya') {
    if (D.scanDate) {
      let sd = new Date(D.scanDate);
      sd.setHours(0,0,0,0);
      let td = new Date();
      td.setHours(0,0,0,0);
      let diff = Math.round((sd.getTime() - td.getTime()) / 86400000);
      let pD = 280 - diff;
      let pW = Math.floor(pD / 7);
      let pDays = pD % 7;
      if(pD >= 0) reddPOG = "at " + pW + "w " + pDays + "d POG\n";
    }
  }

  let displayRace = txVal(D.race) || '-';
  if(D.race === 'Non-Malaysian' || D.race === 'Bukan Warganegara') { displayRace = tc(D.raceCountry) || 'Non-Msian'; }
  
  // SCAN 1
  var s1 = tc(D.name||'-') + "\n";
  s1 += (D.icPassport ? D.icPassport.toUpperCase() : "IC No") + "\n\n";
  
  let relg = txVal(D.religion)||'';
  let delivCount = D.pregList.filter(p => p.type === 'Delivery').length;
  let miscEctCount = D.pregList.filter(p => p.type !== 'Delivery').length;
  let G = D.pregList.length + 1;
  s1 += (D.age||'-') + " " + displayRace + (relg ? " " + relg : "") + ", G" + G + " P" + delivCount + "+" + miscEctCount + " at " + (D.ga||'-') + " POA\n";
  s1 += "LMP: " + (D.lmp?fmt(new Date(D.lmp)):'-') + "    EDD: " + (D.edd||'-') + "\n";
  if (reddPOG) s1 += "REDD Scan: " + (D.scanDate ? fmt(new Date(D.scanDate)) : '?') + " " + reddPOG;
  s1 += "Menses: " + (txVal(D.menses)||'-') + "\n";
  s1 += "Contraception: " + (D.contraYN==='Yes'?(txArr(D.contra).join(', ')||'Yes'):(txVal(D.contraYN)||'-')) + "\n";
  
  // SCAN 2
  var s2 = "Current KK: " + tc(D.currentClinic||'-') + "\n";
  s2 += "Booking KK: " + tc(D.bookingClinic||'-') + " at " + (D.bookingPOA||'-') + " wks\n";
  s2 += "Booking BP: " + (D.bookingBP||'-') + "    Hb: " + (D.bookingHb||'-') + "\n";
  s2 += "Ht: " + (D.height?D.height+'cm':'-') + "    Wt: " + (D.bookingWeight?D.bookingWeight+'kg':'-') + " (BMI: " + (D.bmi||'-') + ")\n";
  s2 += "Current weight: " + (D.currentWeight?D.currentWeight+'kg':'-') + "\n\n";

  s2 += "Blood group: " + (txVal(D.bloodGroup)||'-') + " " + (txVal(D.rhesus)||'-') + "\n";
  s2 += "HIV: " + (txVal(D.hiv)||'-') + ", HepB: " + (txVal(D.hepB)||'-') + ", VDRL: " + (txVal(D.vdrl)||'-') + "\n";
  
  var mgttStr = "MGTT: -";
  if (D.mgttYN === 'Yes') {
    mgttStr = `1st MGTT: ${D.mgtt1Wks||'?'}w (${D.mgtt1Fbs||'?'}/${D.mgtt1TwoHr||'?'}) - ${D.mgtt1Res||'Done'}`;
    if (D.mgtt2Wks || D.mgtt2Res) mgttStr += ` | 2nd MGTT: ${D.mgtt2Wks||'?'}w (${D.mgtt2Fbs||'?'}/${D.mgtt2TwoHr||'?'}) - ${D.mgtt2Res||'Done'}`;
  } else if (D.mgttYN === 'No') {
    mgttStr = "MGTT: Not done";
  }
  s2 += mgttStr;

  // SCAN 3A & 3B
  var s3a = (txVal(D.maritalStatus) || 'Married');
  if(D.maritalStatus === 'Single' || D.maritalStatus === 'Bujang') {
      s3a += (D.stablePartner === 'Yes' ? ' (Stable partner)' : ' (No stable partner)');
  } else if (D.marriedYear) {
      s3a += ", Married since " + D.marriedYear;
  }
  s3a += "\nPast Obstetric History:\n";
  var s3b = "";

  if (D.pregList.length > 0) {
    let hasS3b = false;
    let sortedPreg = [...D.pregList].sort((a,b) => (parseInt(a.year)||0) - (parseInt(b.year)||0));
    
    sortedPreg.forEach((r, i) => {
      let pStr = '';
      if (r.type === 'Delivery') {
          let gStr = r.gestType === 'Prem' ? `Prem (${r.premWeeks||'?'}w)` : (r.gestType === 'Postdates' ? 'Postdates' : 'Term');
          let nicuStr = (r.nicuYN === 'Yes') ? `Admitted (${r.nicuDur||'?'})` : 'Not admitted to ward';
          let cList = r.compArr ? [...r.compArr].map(c => txVal(c)) : [];
          if (r.otherComp && r.otherComp.trim()) cList.push(tc(r.otherComp.trim()));
          let compStr = cList.length > 0 ? "Complications: " + cList.join(", ") : "No complications";
          let outc = (r.outcBtn === 'Healthy') ? 'Baby Healthy' : (r.outcText || r.outcBtn || 'Baby Well');
          pStr = `${r.year||'?'}, ${tc(r.hosp)||'?'}, ${r.mode||'?'}, ${txVal(r.sex)||'?'}, ${r.wgt||'?'}kg, ${gStr}, ${nicuStr}, ${outc}, ${compStr}\n`;
      } else if (r.type === 'IUD') {
          let cList = r.compArr ? [...r.compArr].map(c => txVal(c)) : [];
          if (r.otherComp && r.otherComp.trim()) cList.push(tc(r.otherComp.trim()));
          let compStr = cList.length > 0 ? "Complications: " + cList.join(", ") : "No complications";
          pStr = `${r.year||'?'}, IUD at ${r.iudWeeks||'?'}w, ${tc(r.hosp)||'?'}, ${r.mode||'?'}, ${txVal(r.sex)||'?'}, ${r.wgt||'?'}kg, ${compStr}\n`;
      } else if (r.type === 'Miscarriage') {
          let eStr = (r.erpocYN === 'Yes') ? 'ERPOC done' : 'No ERPOC';
          pStr = `${r.year||'?'}, Miscarriage at ${r.miscWeeks||'?'}w, ${eStr}\n`;
      } else if (r.type === 'Ectopic') {
          let side = r.ectSide ? txVal(r.ectSide) : '?';
          let surg = r.ectSurg ? txVal(r.ectSurg) : '?';
          pStr = `${r.year||'?'}, ${side} Ectopic - ${surg} Salpingectomy\n`;
      }

      if (i < 3) {
          s3a += pStr;
      } else {
          s3b += pStr;
          hasS3b = true;
      }
    });
    if (!hasS3b) s3b = "";
  } else {
    s3a += "Nil\n";
    s3b = "";
  }

  // SCAN 4
  let allergyArr = [];
  if (D.foodAllergyYN === 'Yes' && D.foodAllergyList.length > 0) allergyArr.push("Food: " + D.foodAllergyList.join(', '));
  if (D.foodAllergyOther) allergyArr.push("Food: " + tc(D.foodAllergyOther));
  if (D.medAllergyYN === 'Yes' && D.medAllergyList.length > 0) allergyArr.push("Med: " + D.medAllergyList.join(', '));
  if (D.medAllergyOther) allergyArr.push("Med: " + tc(D.medAllergyOther));
  
  var s4 = (allergyArr.length > 0 ? "Allergies: " + allergyArr.join(' | ') : "No known allergies") + "\n\n";
  s4 += "Antenatal problems:\n";
  let probList = [];
  
  if (D.pmiNew && D.pmiNew.length > 0) {
    D.pmiNew.forEach(pn => {
      let det = D.newCondDetails[pn];
      let str = txVal(pn);
      if (det) {
        let extra = [];
        if (det.wks) extra.push(`since ${det.wks}w`);
        if (det.fup) extra.push(`f/up ${det.fup}`);
        if (det.meds) extra.push(`meds: ${det.meds}`);
        if (extra.length > 0) str += ` (${extra.join(', ')})`;
      }
      probList.push(str);
    });
  }
  if (D.pmiChron && D.pmiChron.length > 0) {
    D.pmiChron.forEach(pc => {
      let det = D.chronDetails[pc];
      let str = txVal(pc);
      if (det) {
        let extra = [];
        if (det.since) extra.push(`since ${det.since}`);
        if (det.meds) extra.push(`meds: ${det.meds}`);
        if (extra.length > 0) str += ` (${extra.join(', ')})`;
      }
      probList.push(str);
    });
  }
  if (D.pmiOthers) probList.push(tc(D.pmiOthers));
  if (D.pmiNewOthers) probList.push(tc(D.pmiNewOthers));
  
  if (probList.length > 0) {
    s4 += probList.map(p => "- " + p).join('\n') + "\n";
  } else {
    s4 += "- Nil\n";
  }

  // VTE Scoring (CPG 2018)
  let vScore = 0;
  let vFactors = [];
  if (parseInt(D.age) >= 35) { vScore += 1; vFactors.push("Age >= 35"); }
  if (parseFloat(D.bmi) >= 40) { vScore += 2; vFactors.push("BMI >= 40"); }
  else if (parseFloat(D.bmi) >= 30) { vScore += 1; vFactors.push("BMI >= 30"); }
  if (delivCount >= 3) { vScore += 1; vFactors.push("Parity >= 3"); }
  if (D.smoker === 'Yes' || D.smoker === 'Ex') { vScore += 1; vFactors.push("Smoker"); }
  if (D.vteFactors && D.vteFactors.length > 0) {
    vScore += D.vteFactors.length;
    vFactors.push(...D.vteFactors);
  }
  s4 += `\nVTE Risk Score: ${vScore} (${vScore >= 3 ? 'High Risk' : 'Low/Intermediate Risk'})\n`;

  // SCAN 5
  var s5 = "Family History:\n";
  if (D.fhx && D.fhx.length > 0) {
    s5 += txArr(D.fhx).join(', ') + (D.fhxCancerType ? ` (${tc(D.fhxCancerType)})` : '') + "\n";
  } else {
    s5 += "No significant family history\n";
  }
  s5 += "\nCurrent Medications:\n";
  let curMeds = [...D.medsList];
  if (D.medications) curMeds.push(tc(D.medications));
  s5 += (curMeds.length > 0 ? curMeds.join(', ') : "Nil") + "\n";

  // SCAN 6
  var s6 = "Lifestyle & Husband Info:\n";
  s6 += `Patient: Occupation: ${D.patOccWorking || D.patOccStudent || D.patOccList.join(', ') || '-'}\n`;
  s6 += `Smoking: ${D.smoker||'-'} | Vape: ${D.vape||'-'} | Alcohol: ${D.alcohol||'-'}\n`;
  s6 += `Husband: Age: ${D.husbAge||'-'} | Occ: ${tc(D.husbOcc)||'-'} | Smoker: ${D.husbSmoker||'-'} | Vape: ${D.husbVape||'-'}\n\n`;
  
  s6 += "Symptoms at review:\n";
  let activeSymp = [];
  if (D.sympContraction) activeSymp.push("Contractions");
  if (D.sympLiquor) activeSymp.push("Leaking liquor");
  if (D.sympBldEarly) activeSymp.push("Bleeding < 22w");
  if (D.sympBldLate) activeSymp.push("Bleeding >= 22w");
  if (D.sympHeadache) activeSymp.push("Headache");
  if (D.sympVision) activeSymp.push("Blurred vision");
  if (D.sympAbd) activeSymp.push("Epigastric pain");
  if (D.sympLaborOther) activeSymp.push(tc(D.sympLaborOther));
  
  s6 += (activeSymp.length > 0 ? activeSymp.join(', ') : "No acute symptoms") + "\n";
  s6 += `Fetal movement: ${D.sympFetal||'-'}` + (D.fmTime ? ` (10 moves by ${D.fmTime})` : '') + (D.fmCount ? ` [Count: ${D.fmCount}]` : '') + "\n";

  // Time taken
  if (startTime) {
     let elapsedMs = Date.now() - startTime;
     let totalSec = Math.floor(elapsedMs / 1000);
     let mins = Math.floor(totalSec / 60);
     let secs = totalSec % 60;
     completionDurationStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
  } else {
     completionDurationStr = '-';
  }
  s6 += "\nTime taken to fill form: " + completionDurationStr;

  s1 = s1.trim();
  s2 = s2.trim();
  s3a = s3a.trim();
  s3b = s3b.trim();
  s4 = s4.trim();
  s5 = s5.trim();
  s6 = s6.trim();

  let fullText = "[SCAN 1]\n" + s1 + "\n\n[SCAN 2]\n" + s2 + "\n\n[SCAN 3A]\n" + s3a;
  if(s3b !== "") {
      fullText += "\n\n[SCAN 3B]\n" + s3b;
  }
  fullText += "\n\n[SCAN 4]\n" + s4 + "\n\n[SCAN 5]\n" + s5 + "\n\n[SCAN 6]\n" + s6;
  
  return [s1, s2, s3a, s3b, s4, s5, s6, fullText];
}

function updateQR() {
  let el = document.getElementById('finalOutputText');
  if(!el) return;
  let text = el.value.replace(/\r\n/g, '\n');
  let scans = text.match(/\[SCAN [A-Z0-9]+\][\s\S]*?(?=\[SCAN [A-Z0-9]+\]|$)/g);
  let parts = (scans && scans.length > 0) ? scans.map(s => s.trim()) : [text];

  let container = document.getElementById('qrContainer');
  if(!container) return;
  container.innerHTML = '';
  
  parts.forEach((chunk, idx) => {
    let box = document.createElement('div');
    box.className = 'qr-box';
    box.innerHTML = '<div class="qr-title">SCAN ' + (idx+1) + ' / ' + parts.length + '</div>' +
                    '<div style="background:white; display:inline-block; padding:12px; border-radius:12px;">' +
                    '<canvas id="qrCanvas' + idx + '"></canvas></div>';
    container.appendChild(box);
    
    try {
      if(typeof QRious !== 'undefined') {
        new QRious({ 
          element: document.getElementById('qrCanvas'+idx), 
          value: chunk, 
          size: 240, 
          level: 'L' 
        });
      }
    } catch(e) { console.error("QR Error:", e); }
  });
}

function buildSummary() {
  try {
    var textArray = generateSplitSummaries();
    var outArea = document.getElementById('finalOutputText');
    if(outArea) { 
      outArea.value = textArray[7]; 
      updateQR();
    }
    
    if(typeof confetti === 'function') {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
    
    var sSound = document.getElementById('successSound');
    if(sSound) {
      sSound.currentTime = 0;
      sSound.play().catch(function(e){ console.log("Audio notice:", e); });
    }
  } catch(err) {
    var errBox = document.getElementById('finalOutputText');
    if(errBox) { errBox.value = "RALAT SISTEM: " + err.message; }
  }
}

window.onload = function() {
  updateFrontPage();
};
